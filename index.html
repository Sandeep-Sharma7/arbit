<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maruti Suzuki Arena Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #e2e8f0; padding: 15px; display: flex; justify-content: center; }
        .calculator-card { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .app-title { text-align: center; font-size: 20px; font-weight: 700; color: #0f172a; }
        .app-subtitle { text-align: center; font-size: 13px; color: #64748b; margin-top: 2px; margin-bottom: 15px; }
        .action-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 10px; border-none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; border: none; }
        .btn-reset { background: #e2e8f0; color: #1e293b; }
        .btn-share { background: #16a34a; color: white; }
        .btn-print { background: #0f172a; color: white; }
        
        .brand-header { border-top: 2px solid #0f172a; border-bottom: 2px solid #0f172a; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-title { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
        .brand-sub { font-size: 9px; color: #64748b; letter-spacing: 1px; }
        .brand-right { text-align: right; font-weight: 800; font-size: 18px; }
        
        .car-image-container { text-align: center; margin-bottom: 15px; }
        .car-image-container img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
        
        .field-label { font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; }
        .select-box { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; font-weight: 700; color: #0f172a; background: #fff; margin-bottom: 15px; outline: none; }
        
        .table-header { background: #0f172a; color: white; display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
        .row-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px dashed #e2e8f0; }
        .row-item label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1e293b; cursor: pointer; }
        .row-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2563eb; cursor: pointer; }
        .item-sub { font-size: 11px; color: #64748b; font-weight: 400; display: block; }
        .amount { font-size: 14px; font-weight: 700; color: #0f172a; }
        
        .btn-group { display: flex; gap: 4px; margin-top: 4px; }
        .btn-opt { padding: 3px 8px; font-size: 10px; font-weight: 700; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .btn-opt.active { background: #0f172a; color: white; border-color: #0f172a; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="app-title">Maruti Suzuki Arena Calculator</div>
    <div class="app-subtitle">Data synchronized from price list</div>

    <div class="action-buttons">
        <button class="btn btn-reset" onclick="resetCalculator()">↺ Reset</button>
        <button class="btn btn-share">💬 Share Image</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
    </div>

    <div class="brand-header">
        <div>
            <div class="brand-title">MARUTI SUZUKI</div>
            <div class="brand-sub">ARENA - WAY OF LIFE</div>
        </div>
        <div class="brand-right">
            <div>ARENA</div>
            <div class="brand-sub">PRICE LIST - SEP 2026</div>
        </div>
    </div>

    <div class="car-image-container">
        <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=600&q=80" alt="Car Image">
    </div>

    <div class="field-label">MODEL CATEGORY:</div>
    <select id="variantSelect" class="select-box" onchange="updateCalculation()"></select>

    <div class="table-header">
        <div># PARTICULARS</div>
        <div>AMOUNT (₹)</div>
    </div>

    <div class="row-item">
        <div>
            <strong>1. Ex-Showroom Price</strong>
            <span class="item-sub">Base Price (2026)</span>
        </div>
        <div class="amount" id="exShowroomVal">₹0</div>
    </div>

    <div class="row-item">
        <label>
            <input type="checkbox" id="chkInsurance" checked onchange="updateCalculation()">
            <span>2. Zero Dep Insurance<span class="item-sub">1+3 Year Cover</span></span>
        </label>
        <div class="amount" id="insuranceVal">₹0</div>
    </div>

    <div class="row-item">
        <div>
            <strong>3. Registration Charges</strong>
            <div class="btn-group">
                <button class="btn-opt active" id="btnRtoUP" onclick="setRto('UP')">UP53</button>
                <button class="btn-opt" id="btnRtoOther" onclick="setRto('OTHER')">Other</button>
            </div>
        </div>
        <div class="amount" id="registrationVal">₹0</div>
    </div>

    <div class="row-item">
        <label>
            <input type="checkbox" id="chkKit" checked onchange="updateCalculation()">
            <span>4. Basic Kit</span>
        </label>
        <div class="amount" id="kitVal">₹0</div>
    </div>

    <div class="row-item">
        <label>
            <input type="checkbox" id="chkFastag" checked onchange="updateCalculation()">
            <span>5. FASTag</span>
        </label>
        <div class="amount" id="fastagVal">₹600</div>
    </div>

    <div class="row-item">
        <label>
            <input type="checkbox" id="chkMsr" checked onchange="updateCalculation()">
            <span>6. Maruti Reward</span>
        </label>
        <div class="amount" id="msrVal">₹885</div>
    </div>

    <div class="row-item">
        <div>
            <strong>7. Extended Warranty</strong>
            <div class="btn-group">
                <button class="btn-opt active" id="btnW6" onclick="setWarranty('6Y')">6Y</button>
                <button class="btn-opt" id="btnW5" onclick="setWarranty('5Y')">5Y</button>
                <button class="btn-opt" id="btnW4" onclick="setWarranty('4Y')">4Y</button>
                <button class="btn-opt" id="btnW0" onclick="setWarranty('0Y')">0Y</button>
            </div>
        </div>
        <div class="amount" id="warrantyVal">₹0</div>
    </div>
</div>

<script>
let carsData = [];
let selectedWarranty = '6Y';
let selectedRto = 'UP';

fetch('cars_data.json')
  .then(res => res.json())
  .then(data => {
      carsData = data;
      populateSelect();
      updateCalculation();
  })
  .catch(() => {
      // Fallback if local json not fetched
      carsData = [
          {"model": "MARUTI ALTO K10 STD 1L 5MT", "exShowroom": 370029.88, "registration": 35602.69, "insurance": 26909, "basicKit": 5439, "extWarranty6Y": 8318.82, "extWarranty5Y": 7610.82, "extWarranty4Y": 4424.82},
          {"model": "MARUTI SWIFT LXI 1.2L 5MT", "exShowroom": 649000.00, "registration": 45000.00, "insurance": 28500, "basicKit": 10500, "extWarranty6Y": 14218.82, "extWarranty5Y": 12500, "extWarranty4Y": 9500}
      ];
      populateSelect();
      updateCalculation();
  });

function populateSelect() {
    const sel = document.getElementById('variantSelect');
    sel.innerHTML = carsData.map((c, i) => `<option value="${i}">${c.model}</option>`).join('');
}

function fmt(num) {
    return '₹' + Math.round(num).toLocaleString('en-IN');
}

function setWarranty(val) {
    selectedWarranty = val;
    ['6Y','5Y','4Y','0Y'].forEach(w => {
        document.getElementById('btnW'+w).classList.toggle('active', w === val);
    });
    updateCalculation();
}

function setRto(val) {
    selectedRto = val;
    document.getElementById('btnRtoUP').classList.toggle('active', val === 'UP');
    document.getElementById('btnRtoOther').classList.toggle('active', val === 'OTHER');
    updateCalculation();
}

function updateCalculation() {
    const idx = document.getElementById('variantSelect').value || 0;
    const car = carsData[idx];
    if(!car) return;

    document.getElementById('exShowroomVal').innerText = fmt(car.exShowroom);
    
    const insVal = document.getElementById('chkInsurance').checked ? car.insurance : 0;
    document.getElementById('insuranceVal').innerText = fmt(insVal);

    const regVal = car.registration;
    document.getElementById('registrationVal').innerText = fmt(regVal);

    const kitVal = document.getElementById('chkKit').checked ? car.basicKit : 0;
    document.getElementById('kitVal').innerText = fmt(kitVal);

    const fastagVal = document.getElementById('chkFastag').checked ? 600 : 0;
    document.getElementById('fastagVal').innerText = fmt(fastagVal);

    const msrVal = document.getElementById('chkMsr').checked ? (car.msr || 885) : 0;
    document.getElementById('msrVal').innerText = fmt(msrVal);

    let wVal = 0;
    if(selectedWarranty === '6Y') wVal = car.extWarranty6Y;
    else if(selectedWarranty === '5Y') wVal = car.extWarranty5Y;
    else if(selectedWarranty === '4Y') wVal = car.extWarranty4Y;
    document.getElementById('warrantyVal').innerText = fmt(wVal);
}

function resetCalculator() {
    document.getElementById('variantSelect').selectedIndex = 0;
    document.getElementById('chkInsurance').checked = true;
    document.getElementById('chkKit').checked = true;
    document.getElementById('chkFastag').checked = true;
    document.getElementById('chkMsr').checked = true;
    setWarranty('6Y');
    setRto('UP');
}
</script>
</body>
</html>
