<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maruti Suzuki Arena Quotation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #eef2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .action-buttons {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: background 0.3s;
    }
    .btn-download { background-color: #0056b3; }
    .btn-download:hover { background-color: #004085; }
    .btn-share { background-color: #25d366; }
    .btn-share:hover { background-color: #1eb253; }

    /* Quotation Card Styling */
    .quotation-card {
      width: 480px;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border: 1px solid #ddd;
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #002c6c;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .header h2 {
      font-size: 20px;
      color: #002c6c;
      letter-spacing: 0.5px;
    }
    .header p {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-top: 15px;
      margin-bottom: 8px;
      text-transform: uppercase;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .row label {
      font-size: 13px;
      font-weight: 500;
      color: #444;
    }
    .input-edit {
      width: 130px;
      text-align: right;
      padding: 5px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    .input-edit:focus {
      border-color: #0056b3;
    }
    .text-input {
      width: 180px;
      text-align: right;
    }
    .total-row {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 2px solid #002c6c;
      font-size: 15px;
      font-weight: bold;
      color: #002c6c;
    }

    /* Export Mode Styles (Used during Canvas Generation) */
    .export-mode .input-edit {
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      box-shadow: none !important;
      text-align: right !important;
    }
    .export-mode input[type="checkbox"],
    .export-mode .toggle-group,
    .export-mode .upload-btn-label {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Action Buttons -->
  <div class="action-buttons">
    <button class="btn btn-download" onclick="downloadAsPNG()">Download Photo</button>
    <button class="btn btn-share" onclick="shareToWhatsApp()">Share Image</button>
  </div>

  <!-- Quotation Card -->
  <div class="quotation-card" id="quotationCard">
    <div class="header">
      <h2>MARUTI SUZUKI ARENA</h2>
      <p>Vehicle On-Road Quotation Details</p>
    </div>

    <!-- Customer & Car Details -->
    <div class="row">
      <label>Customer Name:</label>
      <input type="text" class="input-edit text-input" value="John Doe">
    </div>
    <div class="row">
      <label>Car Model & Variant:</label>
      <input type="text" class="input-edit text-input" value="Swift ZXi">
    </div>

    <div class="section-title">Price Breakdown</div>

    <!-- Price Inputs -->
    <div class="row">
      <label>Ex-Showroom Price (₹):</label>
      <input type="number" class="input-edit calc-input" id="exShowroom" value="750000" oninput="calculateTotal()">
    </div>
    <div class="row">
      <label>RTO / Registration (₹):</label>
      <input type="number" class="input-edit calc-input" id="rto" value="65000" oninput="calculateTotal()">
    </div>
    <div class="row">
      <label>Insurance Amount (₹):</label>
      <input type="number" class="input-edit calc-input" id="insurance" value="32000" oninput="calculateTotal()">
    </div>
    <div class="row">
      <label>Accessories / Kit (₹):</label>
      <input type="number" class="input-edit calc-input" id="accessories" value="15000" oninput="calculateTotal()">
    </div>
    <div class="row">
      <label>Extended Warranty (₹):</label>
      <input type="number" class="input-edit calc-input" id="warranty" value="12000" oninput="calculateTotal()">
    </div>
    <div class="row">
      <label style="color: #d9534f;">Discount / Benefits (₹):</label>
      <input type="number" class="input-edit calc-input" id="discount" value="20000" oninput="calculateTotal()" style="color: #d9534f;">
    </div>

    <!-- Grand Total -->
    <div class="row total-row">
      <label style="font-size: 15px; color: #002c6c;">Grand Total (On-Road):</label>
      <span id="grandTotal" style="font-size: 16px;">₹ 8,54,000</span>
    </div>
  </div>

  <script>
    // Total Calculate karne ka function
    function calculateTotal() {
      const exShowroom = parseFloat(document.getElementById('exShowroom').value) || 0;
      const rto = parseFloat(document.getElementById('rto').value) || 0;
      const insurance = parseFloat(document.getElementById('insurance').value) || 0;
      const accessories = parseFloat(document.getElementById('accessories').value) || 0;
      const warranty = parseFloat(document.getElementById('warranty').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;

      const total = (exShowroom + rto + insurance + accessories + warranty) - discount;
      document.getElementById('grandTotal').innerText = '₹ ' + total.toLocaleString('en-IN');
    }

    // Export hone se pehle inputs ko plain text me badalna
    function prepareForExport() {
      const card = document.getElementById('quotationCard');
      card.classList.add('export-mode');

      // Numeric inputs
      const numInputs = card.querySelectorAll('input[type="number"]');
      numInputs.forEach(input => {
        const span = document.createElement('span');
        span.className = 'temp-export-val';
        span.innerText = parseFloat(input.value || 0).toLocaleString('en-IN');
        span.style.fontWeight = '600';
        span.style.fontSize = '13px';
        input.style.display = 'none';
        input.parentNode.insertBefore(span, input);
      });

      // Text inputs
      const textInputs = card.querySelectorAll('input[type="text"]');
      textInputs.forEach(input => {
        const span = document.createElement('span');
        span.className = 'temp-export-val';
        span.innerText = input.value || '';
        span.style.fontWeight = '600';
        span.style.fontSize = '13px';
        input.style.display = 'none';
        input.parentNode.insertBefore(span, input);
      });
    }

    // Export hone ke baad layout dobara normal karna
    function restoreAfterExport() {
      const card = document.getElementById('quotationCard');
      card.classList.remove('export-mode');

      const tempSpans = card.querySelectorAll('.temp-export-val');
      tempSpans.forEach(span => span.remove());

      const allInputs = card.querySelectorAll('input');
      allInputs.forEach(input => {
        input.style.display = 'inline-block';
      });
    }

    // PNG Download Function
    async function downloadAsPNG() {
      prepareForExport();
      const card = document.getElementById('quotationCard');

      try {
        const canvas = await html2canvas(card, { scale: 2, useCORS: true });
        restoreAfterExport();

        const link = document.createElement('a');
        link.download = 'Maruti_Quotation.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        restoreAfterExport();
        alert("Image generate hone me dikkat aayi.");
      }
    }

    // WhatsApp Share Function
    async function shareToWhatsApp() {
      prepareForExport();
      const card = document.getElementById('quotationCard');
      
      try {
        const canvas = await html2canvas(card, { scale: 2, useCORS: true });
        restoreAfterExport();
        
        canvas.toBlob(async (blob) => {
          if (!blob) {
            alert("Image generate nahi ho saki.");
            return;
          }
          const file = new File([blob], "Maruti_Quotation.png", { type: "image/png" });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Maruti Suzuki Arena Quotation',
                text: 'Maruti Suzuki Arena Quotation Details Attached'
              });
            } catch (error) {
              if (error.name !== 'AbortError') {
                console.error('Sharing failed:', error);
              }
            }
          } else {
            const link = document.createElement('a');
            link.download = 'Maruti_Quotation.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            setTimeout(() => {
              alert("Image download ho gayi hai. Ab WhatsApp par ise attach karke share karein.");
              window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent('Maruti Suzuki Arena Quotation Details Attached'), '_blank');
            }, 1000);
          }
        }, 'image/png');
      } catch (err) {
        restoreAfterExport();
        alert("Image share karne me koi dikkat aayi.");
      }
    }

    // Page Load par initial total calculate karna
    window.onload = calculateTotal;
  </script>
</body>
</html>
